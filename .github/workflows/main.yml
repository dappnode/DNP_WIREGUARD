name: Main
on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "v[0-9]+.[0-9]+.[0-9]+"
    paths-ignore:
      - README.md

permissions:
  contents: read

jobs:
  integration:
    name: TypeScript, images and VPN regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.22.1"
      - run: npm install --global yarn@1.22.22
      - run: yarn --cwd api install --frozen-lockfile --non-interactive
      - run: yarn --cwd api format:check
      - run: docker build -t wireguard-refactor:test .
      - run: docker build -t wireguard-api-refactor:test api
      - run: sudo modprobe wireguard
      - run: node tests/integration.cjs
        timeout-minutes: 15

  build-test:
    name: SDK build
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npx @dappnode/dappnodesdk build --skip_save

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: integration
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Publish
        run: npx @dappnode/dappnodesdk publish patch --dappnode_team_preset
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PINATA_API_KEY: ${{ secrets.PINATA_API_KEY }}
          PINATA_SECRET_API_KEY: ${{ secrets.PINATA_SECRET_API_KEY }}
          DEVELOPER_ADDRESS: "0xf35960302a07022aba880dffaec2fdd64d5bf1c1"
